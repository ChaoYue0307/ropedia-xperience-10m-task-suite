  <g fill="none" stroke="#eaf5e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <rect x="21" y="29" width="17" height="17" rx="4"/>
      <circle cx="56" cy="35" r="8"/>
      <path d="M72 27 L82 44 H62 Z"/>
