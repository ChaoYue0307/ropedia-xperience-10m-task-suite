      <path class="accent" d="M66 44 L77 46 L72 36"/>
      <circle cx="25" cy="72" r="5"/>
      <circle cx="77" cy="46" r="5"/>
      <path d="M51 62 L51 76 M42 69 H60 M51 76 L43 86 M51 76 L61 86"/>

