<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">17 Future Object-Set Forecasting</title>
  <desc id="desc">Ropedia Xperience-10M task icon for Future Object-Set Forecasting.</desc>
