<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting | Xperience-10M Task Suite</title>
  <link rel="canonical" href="https://chaoyue0307.github.io/ropedia-xperience-10m-task-suite/">
  <script>
    (function () {
      var projectBase = "/ropedia-xperience-10m-task-suite/";
      var target = window.location.pathname.indexOf(projectBase) === 0 ? projectBase : "/";
      window.addEventListener("DOMContentLoaded", function () {
        var homeLink = document.getElementById("homeLink");
        if (homeLink) homeLink.href = target;
      });
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020502;
      color: #f4f8ef;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #ccffa0; }
  </style>
</head>
<body>
  <main>
    <h1>Redirecting</h1>
    <p>Go to <a id="homeLink" href="/">Xperience-10M Task Suite</a>.</p>
  </main>
</body>
</html>
